<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Selamat Hari Raya</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@600;800&family=Great+Vibes&family=Lateef:wght@400;700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ==========================================================================
           1. CORE DESIGN SYSTEM & VARIABLES
           ========================================================================== */
        :root {
            --bg-outside: #110d08;
            --box-bg: linear-gradient(180deg, #fbf4ea 0%, #f3e5d0 50%, #e6caa3 100%);
            --gold-primary: #b47b2f;
            --gold-light: #dfb16c;
            --gold-dark: #6e4713;
            --text-main: #3a2a1d;
            --text-gold: #8c6d43;
            --border-frame: #ca8a04;
            --font-display: 'Cinzel Decorative', serif;
            --font-sub: 'Cinzel', serif;
            --font-fancy: 'Great Vibes', cursive;
            --font-arabic: 'Lateef', serif;
            --font-body: 'Poppins', sans-serif;
        }

        /* ==========================================================================
           2. RESET & BASE LAYOUT
           ========================================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-body);
            background: var(--bg-outside);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 10px;
            overflow: hidden;
        }

        /* ==========================================================================
           3. MASTER CINEMA BOX CONTAINER (Semua Elemen Wajib Di Dalam Sini)
           ========================================================================== */
        .master-box {
            width: 100%;
            max-width: 410px;
            height: 680px;
            background: var(--box-bg);
            border: 3px solid var(--border-frame);
            border-radius: 32px;
            position: relative;
            overflow: hidden; /* Memastikan lampion & kembang api tidak keluar box */
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), inset 0 0 40px rgba(180, 123, 47, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 22px;
            text-align: center;
        }

        /* Ukiran Bingkai Mewah Di Dalam Box */
        .inner-luxury-frame {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            bottom: 12px;
            border: 1px solid rgba(180, 123, 47, 0.3);
            border-radius: 24px;
            pointer-events: none;
            z-index: 20;
        }

        .inner-luxury-frame::before, .inner-luxury-frame::after {
            content: '❖';
            position: absolute;
            color: var(--gold-primary);
            font-size: 14px;
        }
        .inner-luxury-frame::before { top: 6px; left: 8px; }
        .inner-luxury-frame::after { bottom: 6px; right: 8px; }

        /* Canvas Kembang Api Khusus Di Dalam Box */
        #box-fireworks {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* ==========================================================================
           4. ORNAMEN LAMPION INTERNAL (DI DALAM BOX)
           ========================================================================== */
        .internal-lantern-rack {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 40px;
            z-index: 15;
            pointer-events: none;
        }

        .hanging-lantern {
            display: flex;
            flex-direction: column;
            align-items: center;
            transform-origin: top center;
        }

        .lantern-left { animation: swingLeft 4s ease-in-out infinite alternate; }
        .lantern-right { animation: swingRight 4.6s ease-in-out infinite alternate; }

        .lantern-cord {
            width: 2px;
            height: 45px;
            background: linear-gradient(to bottom, transparent, var(--gold-primary));
        }

        .lantern-cap {
            width: 22px;
            height: 6px;
            background: var(--gold-dark);
            border-radius: 3px 3px 0 0;
        }

        .lantern-glass {
            width: 36px;
            height: 46px;
            background: linear-gradient(to bottom, var(--gold-light), var(--gold-primary));
            border-radius: 12px;
            position: relative;
            box-shadow: 0 6px 15px rgba(180, 123, 47, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .lantern-glass::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 30px;
            background: #fffdf2;
            border-radius: 6px;
            box-shadow: 0 0 15px #fff;
            animation: glowPulse 2s ease-in-out infinite alternate;
        }

        .lantern-tassel {
            width: 4px;
            height: 12px;
            background: var(--gold-primary);
        }

        /* ==========================================================================
           5. AUDIO CONTROLLER & EQUALIZER WAVE
           ========================================================================== */
        .audio-box-dock {
            position: relative;
            margin-top: 25px;
            margin-bottom: 15px;
            z-index: 25;
        }

        .btn-audio-interactive {
            width: 68px;
            height: 68px;
            background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold-primary) 100%);
            border: 3px solid #fff;
            border-radius: 50%;
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 20px rgba(180, 123, 47, 0.4);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-audio-interactive.active-mode {
            background: linear-gradient(135deg, #4d7c0f 0%, #29420b 100%);
            box-shadow: 0 8px 20px rgba(77, 124, 15, 0.5);
            transform: scale(1.05);
        }

        .visualizer-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 3px;
            height: 18px;
            margin-top: 10px;
        }

        .v-bar {
            width: 3px;
            height: 4px;
            background: var(--gold-primary);
            border-radius: 2px;
        }

        .visualizer-container.playing .v-bar {
            background: #4d7c0f;
            animation: waveBounce 0.6s ease-in-out infinite alternate;
        }

        .visualizer-container.playing .v-bar:nth-child(1) { animation-delay: 0.1s; }
        .visualizer-container.playing .v-bar:nth-child(2) { animation-delay: 0.3s; }
        .visualizer-container.playing .v-bar:nth-child(3) { animation-delay: 0.5s; }
        .visualizer-container.playing .v-bar:nth-child(4) { animation-delay: 0.2s; }
        .visualizer-container.playing .v-bar:nth-child(5) { animation-delay: 0.4s; }

        /* ==========================================================================
           6. TYPOGRAPHY & DESIGN TEXT
           ========================================================================== */
        .txt-celebration {
            font-family: var(--font-fancy);
            font-size: 2.3rem;
            color: var(--gold-dark);
            margin-bottom: -5px;
            position: relative;
            z-index: 10;
        }

        .txt-main-title {
            font-family: var(--font-display);
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(to bottom, var(--gold-dark), var(--gold-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.1;
            margin-bottom: 8px;
            position: relative;
            z-index: 10;
        }

        .badge-date {
            display: inline-block;
            background: var(--gold-primary);
            color: #fbf4ea;
            font-family: var(--font-sub);
            font-size: 0.8rem;
            font-weight: 800;
            padding: 4px 18px;
            border-radius: 30px;
            letter-spacing: 2px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(180, 123, 47, 0.2);
            position: relative;
            z-index: 10;
        }

        /* ==========================================================================
           7. VECTOR MASJID UKIRAN MEWAH (SVG PRO)
           ========================================================================== */
        .mosque-carving-svg {
            width: 100%;
            height: auto;
            max-height: 110px;
            margin: 5px 0;
            position: relative;
            z-index: 10;
            filter: drop-shadow(0 4px 8px rgba(109, 71, 19, 0.15));
        }

        .txt-arabic-calligraphy {
            font-family: var(--font-arabic);
            font-size: 3.4rem;
            color: var(--gold-primary);
            line-height: 1;
            margin-bottom: 10px;
            position: relative;
            z-index: 10;
        }

        /* Card Ucapan Bersih Tanpa Label Tambahan */
        .speech-box {
            background: rgba(255, 255, 255, 0.65);
            border: 1px solid rgba(180, 123, 47, 0.2);
            border-radius: 20px;
            padding: 18px 15px;
            margin-bottom: 20px;
            position: relative;
            z-index: 10;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        .speech-box p {
            font-family: var(--font-body);
            font-size: 0.9rem;
            line-height: 1.65;
            color: var(--text-main);
            font-weight: 500;
        }

        /* Tombol Salin Utama */
        .btn-action-copy {
            width: 85%;
            background: transparent;
            border: 2px solid var(--gold-primary);
            color: var(--gold-primary);
            font-family: var(--font-body);
            font-weight: 700;
            font-size: 0.85rem;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
            z-index: 25;
            transition: all 0.3s ease;
        }

        .btn-action-copy:hover, .btn-action-copy:active {
            background: var(--gold-primary);
            color: white;
            box-shadow: 0 6px 15px rgba(180, 123, 47, 0.3);
        }

        /* ==========================================================================
           8. TIMELINE KEYFRAMES ANIMATION
           ========================================================================== */
        @keyframes swingLeft {
            0% { transform: rotate(-4deg); }
            100% { transform: rotate(4deg); }
        }

        @keyframes swingRight {
            0% { transform: rotate(3deg); }
            100% { transform: rotate(-3deg); }
        }

        @keyframes glowPulse {
            0% { opacity: 0.7; box-shadow: 0 0 10px #fff; }
            100% { opacity: 1; box-shadow: 0 0 22px #fff, 0 0 10px var(--gold-light); }
        }

        @keyframes waveBounce {
            0% { height: 4px; }
            100% { height: 18px; }
        }

        /* Toast Popup Notifikasi */
        .toast-popup {
            position: fixed;
            bottom: 30px;
            background: var(--gold-dark);
            color: white;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100;
        }

        .toast-popup.visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="master-box">
        <div class="inner-luxury-frame"></div>
        
        <canvas id="box-fireworks"></canvas>

        <div class="internal-lantern-rack">
            <div class="hanging-lantern lantern-left">
                <div class="lantern-cord"></div>
                <div class="lantern-cap"></div>
                <div class="lantern-glass"></div>
                <div class="lantern-tassel"></div>
            </div>
            <div class="hanging-lantern lantern-right">
                <div class="lantern-cord"></div>
                <div class="lantern-cap"></div>
                <div class="lantern-glass"></div>
                <div class="lantern-tassel"></div>
            </div>
        </div>

        <div class="audio-box-dock">
            <button class="btn-audio-interactive" id="playTrigger">
                <i class="fas fa-play" id="iconState"></i>
            </button>
            <div class="visualizer-container" id="visualizerNode">
                <div class="v-bar"></div>
                <div class="v-bar"></div>
                <div class="v-bar"></div>
                <div class="v-bar"></div>
                <div class="v-bar"></div>
            </div>
        </div>

        <p class="txt-celebration">Selamat Hari Raya</p>
        <h1 class="txt-main-title">IDUL ADHA</h1>
        <div class="badge-date">1447 HIJRIAH</div>

        <svg class="mosque-carving-svg" viewBox="0 0 240 90" xmlns="http://www.w3.org/2000/svg">
            <path d="M90,80 C90,45 105,35 120,35 C135,35 150,45 150,80" fill="none" stroke="rgba(180,123,47,0.2)" stroke-width="2" stroke-dasharray="3,3"/>
            <path d="M85,75 C85,38 102,22 120,8 C138,22 155,38 155,75 Z" fill="var(--gold-primary)" opacity="0.9" />
            <rect x="35" y="25" width="8" height="50" fill="var(--gold-light)" />
            <path d="M33,25 L39,12 L45,25 Z" fill="var(--gold-dark)" />
            <circle cx="39" cy="35" r="2" fill="#fff" />
            <circle cx="39" cy="50" r="2" fill="#fff" />
            
            <rect x="197" y="25" width="8" height="50" fill="var(--gold-light)" />
            <path d="M195,25 L201,12 L207,25 Z" fill="var(--gold-dark)" />
            <circle cx="201" cy="35" r="2" fill="#fff" />
            <circle cx="201" cy="50" r="2" fill="#fff" />
            
            <rect x="20" y="75" width="200" height="4" fill="var(--gold-dark)" />
        </svg>

        <div class="txt-arabic-calligraphy">عيد مبارك</div>

        <div class="speech-box">
            <p id="targetTeksUcapan">"Selamat Hari Raya Idul Adha. Semoga momentum suci ini dipenuhi dengan kedamaian, kebahagiaan, kemuliaan, serta membawa limpahan berkah yang tak terputus bagi kita dan keluarga besar."</p>
        </div>

        <button class="btn-action-copy" id="actionCopyBtn">
            <i class="fa-regular fa-copy"></i> Salin Ucapan Teks
        </button>
    </div>

    <audio id="audioEngineCore" loop preload="auto">
        <source src="takbiran.mp3" type="audio/mpeg">
    </audio>

    <div class="toast-popup" id="toastNode">Teks ucapan berhasil disalin!</div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            
            // --- AUDIO CONTROLLER LOGIC ---
            const audio = document.getElementById("audioEngineCore");
            const playBtn = document.getElementById("playTrigger");
            const iconState = document.getElementById("iconState");
            const visualizer = document.getElementById("visualizerNode");

            playBtn.addEventListener("click", function() {
                if (audio.paused) {
                    audio.play().then(() => {
                        playBtn.classList.add("active-mode");
                        visualizer.classList.add("playing");
                        iconState.className = "fas fa-pause";
                    }).catch(err => {
                        alert("File 'takbiran.mp3' belum terbaca di folder GitHub Anda. Pastikan berkas sudah diupload bersama file HTML ini!");
                    });
                } else {
                    audio.pause();
                    playBtn.classList.remove("active-mode");
                    visualizer.classList.remove("playing");
                    iconState.className = "fas fa-play";
                }
            });

            // --- COPY FUNCTION LOGIC ---
            const copyBtn = document.getElementById("actionCopyBtn");
            const textSource = document.getElementById("targetTeksUcapan");
            const toast = document.getElementById("toastNode");

            copyBtn.addEventListener("click", function() {
                navigator.clipboard.writeText(textSource.innerText);
                toast.classList.add("visible");
                setTimeout(() => { toast.classList.remove("visible"); }, 2500);
            });

            // --- AUTO-FIREWORKS MATHEMATICAL LAYER INSIDE CANVA BOX ---
            const canvas = document.getElementById("box-fireworks");
            const ctx = canvas.getContext("2d");
            
            // Ukuran Canvas wajib presisi mengikuti dimensi Pembungkus (.master-box)
            let cWidth = canvas.width = canvas.offsetWidth || 366; 
            let cHeight = canvas.height = canvas.offsetHeight || 680;

            const fireworksArray = [];
            const particlesArray = [];

            class FireworkRocket {
                constructor() {
                    this.x = Math.random() * cWidth;
                    this.y = cHeight;
                    this.targetY = Math.random() * (cHeight * 0.4) + 60; // Meledak di area atas box
                    this.speed = Math.random() * 3 + 4;
                    this.color = `hsl(${Math.random() * 360}, 100%, 65%)`;
                }
                update() {
                    this.y -= this.speed;
                    if (this.y <= this.targetY) {
                        this.explode();
                        return false;
                    }
                    return true;
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                }
                explode() {
                    for (let i = 0; i < 35; i++) {
                        particlesArray.push(new FireworkParticle(this.x, this.y, this.color));
                    }
                }
            }

            class FireworkParticle {
                constructor(x, y, color) {
                    this.x = x;
                    this.y = y;
                    this.color = color;
                    this.radius = Math.random() * 2 + 0.5;
                    let angle = Math.random() * Math.PI * 2;
                    let speed = Math.random() * 3 + 1;
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;
                    this.alpha = 1;
                    this.decay = Math.random() * 0.015 + 0.015;
                }
                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.vy += 0.04; // Efek gaya gravitasi jatuh pelan
                    this.alpha -= this.decay;
                    return this.alpha > 0;
                }
                draw() {
                    ctx.save();
                    ctx.globalAlpha = this.alpha;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                    ctx.restore();
                }
            }

            // Atur interval konstan peluncuran roket kembang api otomatis dari bawah box
            let launchTimer = 0;

            function runRenderLoop() {
                // Efek trail bayangan pudar kembang api
                ctx.fillStyle = 'rgba(251, 244, 234, 0.2)';
                ctx.fillRect(0, 0, cWidth, cHeight);

                launchTimer++;
                if (launchTimer % 45 === 0) { // Setiap beberapa frame roket baru meluncur otomatis
                    fireworksArray.push(new FireworkRocket());
                }

                // Update & menggambar roket kembang api
                for (let i = fireworksArray.length - 1; i >= 0; i--) {
                    if (!fireworksArray[i].update()) {
                        fireworksArray.splice(i, 1);
                    } else {
                        fireworksArray[i].draw();
                    }
                }

                // Update & menggambar serpihan ledakan kembang api
                for (let i = particlesArray.length - 1; i >= 0; i--) {
                    if (!particlesArray[i].update()) {
                        particlesArray.splice(i, 1);
                    } else {
                        particlesArray[i].draw();
                    }
                }

                requestAnimationFrame(runRenderLoop);
            }

            // Penyesuaian ukuran jika orientasi layar bergeser
            window.addEventListener('resize', function() {
                cWidth = canvas.width = canvas.offsetWidth;
                cHeight = canvas.height = canvas.offsetHeight;
            });

            runRenderLoop();
        });
    </script>
</body>
</html>
